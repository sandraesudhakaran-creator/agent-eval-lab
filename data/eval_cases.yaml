# Evaluation set for the Velora demo domain (fictional data).
#
# Fields
#   id, category, question
#   expected_facts   list of facts; each fact is a list of accepted spellings (any one counts)
#   forbidden        strings that must NOT appear (hallucination / wrong action checks)
#   answerable       false = the correct behaviour is to say "I don't know"
#   expected_tools   tools a good agent should call (agent mode only)
#   expected_tool_args  {tool: {argument: value}} that must match (case-insensitive)
#   expected_sources documents that contain the answer (retrieval check; "models" = specs table)
#
# Numbers were computed from data/models.csv and data/kb/*.md - see the comments.

- id: warranty_battery
  category: doc_lookup
  question: How long is the battery warranty and what capacity is guaranteed?
  expected_facts: [["8 years", "8-year", "eight years", "eight-year"], ["160,000", "160000 km"], ["70 %", "70%", "70 percent"]]
  expected_tools: [search_docs]
  expected_sources: [warranty]

- id: warranty_transfer
  category: doc_lookup
  question: If I sell my Velora, does the warranty transfer to the new owner?
  expected_facts: [["transfer", "transferred", "passes", "tied to the car"]]
  expected_tools: [search_docs]
  expected_sources: [warranty]

